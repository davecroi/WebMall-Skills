# SkillOpt config for condition C3. Spec:
# webmall_skills/skillopt_webmall/DESIGN.md
_base_: ../../../SkillOpt/configs/_base_/default.yaml   # webmall_skills/skillopt_webmall/configs -> repo root

model:
  backend: openai_compatible          # SkillOpt's openai_chat is Azure-only
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  optimizer: z-ai/glm-5.3-flash       # via OpenRouter; temperature not sent (provider default)
  target: z-ai/glm-5.3-flash          # rollouts run through AgentLab (agent_config.TARGET_AGENT)

train:
  num_epochs: 2                       # 2 epochs x 2 steps = 4 gated steps
  batch_size: 13                      # 26 train tasks (split_v2) -> 2 steps per epoch
  seed: 42

gradient:
  minibatch_size: 4
  merge_batch_size: 4

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: false              # C3 = fast loop only (deviation from SkillOpt defaults)
  use_meta_skill: false

evaluation:
  use_gate: true
  # Task completion first, F1 as tie-breaker: score = 0.96 * CR + 0.04 * F1 over 21 val tasks x 1 repeat.
  # One more completed task moves CR by 1/21, worth 0.96/21 = 0.0457 > 0.04 = the largest possible F1
  # term, so F1 only decides between candidates with equal CR. Keep weight < 1/(n_val + 1).
  gate_metric: mixed
  gate_mixed_weight: 0.04
  sel_env_num: 0                      # all val tasks
  test_env_num: 0
  eval_test: false

env:
  name: webmall
  skill_init: webmall_skills/skills/base/SKILL.md      # relative to the repo root
  split_mode: split_dir
  split_dir: webmall_skills/split/split_v2              # same tasks as the thesis' skillopt_webmall/split_v2: v1 (11/11/33) + unused tasks; test unchanged
  val_repeats: 1                      # more val tasks instead of repeats (split_v2)
  budget_usd: 25
  # USD per 1M tokens for z-ai/glm-5.3-flash, rounded up from the effective price of the two GLM
  # test runs (OpenRouter-reported cost fit over 66 tasks: 0.0397 in / 0.0933 out, 2026-10-27).
  price_input_per_m: 0.04
  price_output_per_m: 0.10
  n_jobs: 1
